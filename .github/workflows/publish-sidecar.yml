name: Publish Rin sidecar

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/rinspacehq/rinspace-rin:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/rinspacehq/rinspace-rin
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
      - run: echo "ghcr.io/rinspacehq/rinspace-rin@${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
